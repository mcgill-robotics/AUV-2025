services: 
  douglas:
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ../../../AUV-2025
        target: /AUV-2025
    image: "mcgillrobotics/auv_2025:jetson"
    privileged: true
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - UDEV=on
      - ROS_MASTER_URI=http://192.168.0.105:11311
      - ROS_IP=192.168.0.105
      - ROS_DOMAIN_ID=0

    runtime: nvidia
    command: bash -c "source /opt/ros/noetic/setup.bash && roscore" 
    network_mode: host
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  zed:
    volumes:
      - /dev:/dev
    image: "mcgillrobotics/auv_2025:zed"
    build:
      context: ../../../AUV-2025
      dockerfile: Docker/jetson/Dockerfile.zed
    privileged: true
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - UDEV=on
      - ROS_MASTER_URI=http://192.168.0.105:11311
      - ROS_IP=192.168.0.105
      - ROS_DOMAIN_ID=0
    runtime: nvidia
    network_mode: host

    command: bash -c "source /opt/ros/humble/setup.bash && source /root/ros2_ws/install/local_setup.bash && ros2 launch zed_wrapper zed_camera.launch.py camera_model:=zed2i" 

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


  bridge:
    image: "mcgillrobotics/auv_2025:rosbridge"
    build:
      context: ../../../AUV-2025
      dockerfile: Docker/jetson/Dockerfile.bridge
    privileged: true
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - ROS_MASTER_URI=http://192.168.0.105:11311
      - ROS_IP=192.168.0.105
      - ROS_DOMAIN_ID=0
    network_mode: host
    command: bash -c "source /set_env.bash && source /opt/ros/foxy/setup.bash && ros2 run ros1_bridge dynamic_bridge"
