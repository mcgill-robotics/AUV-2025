# params/zed2i.yaml
# Parameters for Stereolabs ZED 2i camera
---

general:
    camera_model:               'zed2i'
    grab_resolution:            'VGA'     # 'HD2K', 'HD1080', 'HD720', 'VGA', 'AUTO'
    grab_frame_rate:             100          # Frequency of frame grabbing for internal SDK operations

depth:
    min_depth:                  0.5         # Min: 0.3, Max: 3.0 - Default 0.7 - Note: reducing this value wil require more computational power and GPU memory
    max_depth:                  20.0        # Max: 40.0

pos_tracking:
    publish_tf:                 false
    publish_map_tf:             false        
