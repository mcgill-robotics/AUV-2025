ekf_local:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.5
    two_d_mode: false

    transform_time_offset: 0.0
    transform_timeout: 0.0
    transform_orientation: [0, 0, 0, 1, 0, 0, 0]

    print_diagnostics: true
    debug: false

    world_frame: odom
    map_frame: map
    odom_frame: odom
    base_link_frame: auv

    publish_tf: false
    
    # Define TOPIC NAMES for local odometry fusion
    twist0: /sensors/dvl/twist
    twist0_config:
    [false, false, false, 
     false, false, false, 
     true,  true,  true, 
     false, false, false,
     false, false, false]
    twist0_differential: false

    imu0: /sensors/imu/data
    imu0_config:
    [false, false, false, 
     true,  true,  true, 
     false, false, false, 
     true,  true,  true,
     true,  true,  true] 
    imu0_remove_gravitational_acceleration: false   # Using free-fall mode manually

    pose0: /sensors/depth/pose
    pose0_config:
    [false, false, true, 
     false, false, false, 
     false, false, false, 
     false, false, false,
     false, false, false]
    pose0_relative:     false
    pose0_differential: false