name: Docker Build & Push for base and dependencies

on:
  push:
    branches: [noetic]
    paths:
      - 'Docker/base/**'
      - 'Docker/sim/**'
      - 'Docker/poolside/**'
  pull_request:
    branches: [noetic]
    paths:
      - 'Docker/base/**'
      - 'Docker/sim/**'
      - 'Docker/poolside/**'
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'  # 4 AM Montreal time

jobs:
  build-and-push-base:
    name: Build and optionally push base Docker image
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (only if pushing)
        if: true
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v5
        with:
          context: Docker/base
          file: Docker/base/Dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          tags: mcgillrobotics/auv_2025:base
