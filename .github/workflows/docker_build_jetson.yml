name: Docker Build & Push for jetson

on:
  push:
    branches: [noetic]
    paths:
      - 'Docker/jetson/**'
  pull_request:
    branches: [noetic]
    paths:
      - 'Docker/jetson/**'
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'  # 4 AM Montreal time

jobs:
  build-and-push-jetson:
    name: Build and optionally push jetson Docker image
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (only if pushing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/noetic'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v5
        with:
          context: Docker/jetson
          file: Docker/jetson/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/noetic' }}
          tags: mcgillrobotics/auv_2025:jetson
  
  build-and-push-bridge:
    name: Build and optionally push bridge Docker image
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (only if pushing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/noetic'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v5
        with:
          context: Docker/jetson
          file: Docker/jetson/Dockerfile.bridge
          platforms: linux/arm64, linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/noetic' }}
          tags: mcgillrobotics/auv_2025:rosbridge
  
  build-and-push-zed:
    name: Build and optionally push zed Docker image
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (only if pushing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/noetic'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v5
        with:
          context: Docker/jetson
          file: Docker/jetson/Dockerfile.zed
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/noetic' }}
          tags: mcgillrobotics/auv_2025:zed
