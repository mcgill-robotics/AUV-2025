name: Catkin Integration Test

on:
  push:
    branches: [noetic]
  pull_request:
    branches: [noetic]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'  # 4 AM Montreal time

jobs:
  catkin-build:
    name: Build catkin workspace
    runs-on: ubuntu-22.04-arm
    container:
        image: mcgillrobotics/auv_2025:base
    steps:
      - uses: actions/checkout@v3
      - name: catkin build
        shell: bash
        run: |
            git config --global --add safe.directory /__w/AUV-2025/AUV-2025
            git submodule update --init --recursive
            source /opt/ros/noetic/setup.bash
            cd catkin_ws
            catkin build
