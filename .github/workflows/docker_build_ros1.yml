name: Docker Build & Push for ros1

on:
  push:
    branches:
      - noetic
      - stateEstimationv1-squashed
  pull_request:
    branches:
      - noetic
      - stateEstimationv1-squashed
    paths:
      - 'Docker/ros1/**'
      - '.github/workflows/docker_build_ros1.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  build-and-push:
    name: ros1 Docker image
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (only if pushing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/noetic'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v5
        with:
          context: Docker/ros1
          file: Docker/ros1/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/noetic' }}
          tags: mcgillrobotics/auv_2025:ros1
